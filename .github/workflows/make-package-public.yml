name: Make Package Public

on:
  workflow_dispatch:

jobs:
  repush-as-public:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull private image, retag, and push as public
        run: |
          # Pull existing image (GITHUB_TOKEN can pull from private package linked to this repo)
          docker pull ghcr.io/kcoikz/video-pipeline:latest
          # Retag to video-pipeline-pub (new name → public by default since repo is now public)
          docker tag ghcr.io/kcoikz/video-pipeline:latest ghcr.io/kcoikz/video-pipeline-pub:latest
          # Push new public tag
          docker push ghcr.io/kcoikz/video-pipeline-pub:latest
          echo "Done — image available at ghcr.io/kcoikz/video-pipeline-pub:latest"
