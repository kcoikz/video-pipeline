name: Make Package Public

on:
  workflow_dispatch:

jobs:
  set-visibility:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set container package visibility to public
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/users/kcoikz/packages/container/video-pipeline \
            -d '{"visibility":"public"}' \
            | tee /tmp/result.json
          STATUS=$(cat /tmp/result.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('visibility','unknown'))" 2>/dev/null || echo "check output above")
          echo "Visibility: $STATUS"
